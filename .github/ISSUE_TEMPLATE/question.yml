name: Question
description: Something the Support page doesn't answer.
labels: [question]
body:
  - type: textarea
    id: question
    attributes:
      label: Your question
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Lanework version and build, if it matters
      description: Shown in Lanework's About window.
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I checked the Support page at laneworkapp.com/support.
          required: true
